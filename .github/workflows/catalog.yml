# =============================================================================
# REBUILD THE PRICE CATALOG
# -----------------------------------------------------------------------------
# This is the only thing in the whole project that ever talks to Amazon.
#
# The live site makes zero API requests — it serves data/catalog.json, which is
# a file committed to this repository. This workflow is what refreshes that
# file: it runs the build script, gets fresh prices, commits the result, and
# the push makes Vercel redeploy automatically. Nothing to install, no terminal.
#
# -----------------------------------------------------------------------------
# WHAT IT COSTS
# -----------------------------------------------------------------------------
# One run spends about 33 API requests (27 searches plus up to 6 top-ups when a
# category comes up short). The free plan gives 100 a month.
#
# The API is Axesso "Amazon Data Service" on RapidAPI. Its free plan is a HARD
# limit: at 100 requests it refuses, it does not start charging. Several of the
# cheaper-looking alternatives are "20 free, then ten cents each" and want a
# card on file before they will let you subscribe at all. This one does not.
#
#   1 scheduled run                   = ~33
#   2 manual runs / retries spare     = ~66
#                                       ----
#                                       ~99 of 100
#
# This used to run twice a month, which spent 66 of the 100 and left no room to
# retry a bad run. That is a bad trade: a rebuild that fails halfway is far more
# likely than prices moving enough in two weeks to matter, and with no headroom
# the only fix was to wait for the next month. One scheduled run a month, two
# retries in reserve.
#
# IMPORTANT — WHEN THE MONTH RESETS
# A RapidAPI free plan does NOT reset on the 1st. It resets on the day of the
# month you subscribed. This one was subscribed on 28 July 2026, so the
# schedule below runs on the 29th: the day after a fresh 100 requests appear.
# Check the real date under Billing → Subscriptions & Usage before changing it,
# and move the cron day with it if you ever resubscribe or switch APIs.
#
# Quotas are counted per API subscription, not per account — so the 100 here is
# untouched by anything spent on any other API subscribed with the same key.
#
# -----------------------------------------------------------------------------
# SETUP (once)
# -----------------------------------------------------------------------------
#   Settings → Secrets and variables → Actions → New repository secret
#     Name:   RAPIDAPI_KEY
#     Value:  your key from rapidapi.com
#
# The key lives there and nowhere else. It is never in the code, never in the
# committed catalog, and never sent to the browser — this workflow is the only
# thing that reads it, and it runs on GitHub's machines, not on the website.
#
# -----------------------------------------------------------------------------
# RUNNING IT BY HAND
# -----------------------------------------------------------------------------
#   Actions tab → "Rebuild price catalog" → Run workflow
#
# One note about the schedule: GitHub switches off scheduled workflows in
# repositories that have had no activity for 60 days. If prices stop updating,
# that is the first thing to check — a single manual run switches it back on.
# =============================================================================

name: Rebuild price catalog

on:
  workflow_dispatch:
  schedule:
    # 09:00 UTC on the 29th — the morning after the plan's quota rolls over.
    # See the note above: this date tracks the subscription date, not the 1st.
    - cron: "0 9 29 * *"

# The job commits back to the repository, so it needs write access. This is the
# narrowest permission that lets it do that and nothing else.
permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch prices and rebuild data/catalog.json
        env:
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: |
          if [ -z "$RAPIDAPI_KEY" ]; then
            echo "::error::RAPIDAPI_KEY secret is not set. Add it under"
            echo "::error::Settings → Secrets and variables → Actions, then run this again."
            exit 1
          fi
          node scripts/build-catalog.mjs

      - name: Refuse to publish placeholder data
        run: |
          # The build script marks the catalog when the ASINs in it aren't real
          # Amazon identifiers. If that flag is set, something went wrong badly
          # enough that the site would end up showing invented prices — so stop
          # here and leave the previous catalog in place.
          if node -e "process.exit(require('./data/catalog.json').sample ? 1 : 0)"; then
            echo "Catalog contains real Amazon listings."
          else
            echo "::error::The rebuilt catalog is placeholder data, not real listings."
            echo "::error::Nothing has been committed. Check the RAPIDAPI_KEY secret."
            exit 1
          fi

      - name: Commit the new prices
        run: |
          git config user.name  "rigscout-catalog"
          git config user.email "actions@github.com"
          git add data/catalog.json
          if git diff --staged --quiet; then
            echo "Prices are unchanged since the last run — nothing to commit."
            exit 0
          fi
          BUILT=$(node -e "console.log(require('./data/catalog.json').builtAt)")
          SHELF=$(node -e "console.log(require('./data/catalog.json').shelf)")
          git commit -m "Catalog rebuilt ${BUILT} — ${SHELF} products per category"
          git push
